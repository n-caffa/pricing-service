spring:
  application:
    name: pricing-service

  datasource:
    url: jdbc:h2:mem:pricingdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080